<meta charset="utf-8"/>

<title>ROBI Zigzag 场景 4 第 0 帧</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 14px/1.45 "Segoe UI", "Noto Sans SC", sans-serif;
    background: #f4f1ea; color: #1c1915;
  }
  header { padding: 14px 18px 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 650; }
  .sub { margin: 0; color: #4e4942; max-width: 1080px; }
  #speeds {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .speed {
    background: #fff; border: 1px solid #e3ddd2; border-radius: 10px;
    padding: 8px 10px; min-height: 92px;
  }
  .speed b { display: block; margin-bottom: 4px; }
  .speed p { margin: 0; color: #3f3a34; }
  #tabs { display: flex; gap: 8px; padding: 4px 18px 0; flex-wrap: wrap; }
  .tab {
    border: 1px solid #d7d0c4; background: #fff; color: inherit;
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  .tab.on { background: #1c1915; color: #fff; border-color: #1c1915; }
  #summary { padding: 8px 18px 6px; font-variant-numeric: tabular-nums; }
  #summary .note { color: #5c564e; }
  main {
    display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px; padding: 0 18px 14px;
    height: 72vh; min-height: 560px;
  }
  #list {
    overflow: auto; background: #fff; border: 1px solid #e3ddd2; border-radius: 12px;
  }
  .group { padding: 8px 10px 2px; color: #6b645b; font-size: 12px; }
  .row {
    width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    display: grid; grid-template-columns: 64px 72px 1fr auto; gap: 6px; align-items: center;
    padding: 7px 10px; border: 0; border-bottom: 1px solid #f0ece4; background: #fff;
  }
  .row.on { background: #fff3cc; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .hit { color: #245db3; }
  .wrong { color: #e8590c; }
  .miss { color: #868e96; }
  .extra { color: #3b5bdb; }
  .low { color: #9a9288; font-size: 12px; }
  .view { position: relative; min-height: 280px; background: #141414; border-radius: 12px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .hint {
    position: absolute; left: 10px; bottom: 8px; color: #f8f5ef; font-size: 12px;
    text-shadow: 0 1px 2px #000; pointer-events: none;
  }
  #detail {
    margin: 0 18px 12px; padding: 8px 12px; background: #fff; border-radius: 10px;
    border: 1px solid #e3ddd2; min-height: 38px;
  }
  @media (max-width: 1100px) {
    #speeds { grid-template-columns: 1fr 1fr; }
    main { grid-template-columns: 1fr; height: auto; min-height: 0; }
    #list { max-height: 320px; }
    .view { height: 520px; }
  }
  .author-credit { margin: 18px 0 0; padding: 14px; color: #64748b; font-size: 13px; text-align: center; }
  .author-credit a { color: inherit; }
</style>

<body>
<header>
<h1>Zigzag，场景 4，第 0 帧</h1>
<p class="sub">Ensenso 左图和同一相机的深度。四种方法分开画。蓝、橙、紫的实线是预测位姿的轮廓，绿色虚线是真值轮廓。实线和虚线叠在一起，表示投影轮廓接近。点左边一行、照片里的轮廓，或右边的物体网格模型，高亮的是同一个实例。可见度不到 0.6 的零件也在里面，论文计分时不计入它们。</p>
<div id="speeds"></div>
</header>
<nav id="tabs"></nav>
<div id="summary"></div>
<main>
<aside id="list"></aside>
<section class="view">
<canvas id="photo"></canvas>
<div class="hint">实线是预测轮廓，绿色虚线是真值</div>
</section>
<section class="view">
<canvas id="world"></canvas>
<div class="hint">拖动旋转，滚轮远近，双击回到相机视角</div>
</section>
</main>
<div id="detail">正在载入这一帧。</div>
<div hidden="" id="proj-check"></div>
